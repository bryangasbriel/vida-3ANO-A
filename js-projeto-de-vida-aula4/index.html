<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus objetivos do ano</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section class="conteudo-principal">
        <h2 class="titulo-principal">Meus Objetivos do ano<span>_</span></h2>
        <div class="conteudo">
            <div class="botoes">
                <button class="botao ativo">fazer a formatura</button>
                <button class="botao">pasar no concurso da federal</button>
                <button class="botao">casar e ter filhos</button>
                <button class="botao">dar uma vida boa para minha mãe</button>
            </div>
            <div class="abas-textos">
                <div class="aba-conteudo ativo">
                    <h3 class="aba-conteudo-titulo-principal">fazer a formatura</h3>
                    <h4 class="aba-conteudo-titulo-secundario">Tempo para completar o objetivo 8 meses </h4>
                    <div class="contador"></div>
                </div>
                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">pasar no concurso da federal</h3>
                    <h4 class="aba-conteudo-titulo-secundario">Tempo para completar o objetivo 4 anos</h4>
                    <div class="contador"></div>
                </div>
                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">casar e ter filhos</h3>
                    <h4 class="aba-conteudo-titulo-secundario">Tempo para completar o objetivo 40 anos</h4>
                    <div class="contador"></div>
                </div>
                <div class="aba-conteudo">
                    <h3 class="aba-conteudo-titulo-principal">dar uma vida boa para minha mãe</h3>
                    <h4 class="aba-conteudo-titulo-secundario">Tempo para completar o objetivo 20 anos</h4>
                    <div class="contador"></div>
                </div>
            </div>
        </div>
    </section>
    <script src="main.js"></script>

    
</body>

</html>
